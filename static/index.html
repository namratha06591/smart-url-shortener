
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartURL | Link Shortener</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: linear-gradient(135deg, #0f172a, #172554, #312e81);
    }

    .card {
      width: min(100%, 560px);
      padding: 36px;
      border: 1px solid #475569;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.94);
      box-shadow: 0 24px 70px #0005;
    }

    .logo {
      color: #a5b4fc;
      font-size: 14px;
      letter-spacing: 2px;
    }

    h1 { font-size: 38px; margin: 18px 0 10px; }
    p { color: #cbd5e1; line-height: 1.6; }

    input {
      width: 100%;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      font-weight: bold;
    }

    #submit {
      width: 100%;
      color: white;
      background: #6366f1;
    }

    #submit:disabled { opacity: 0.6; }

    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 12px;
      background: #1e293b;
      overflow-wrap: anywhere;
    }

    #shortLink { color: #a5b4fc; }
    #copy { margin-top: 14px; color: white; background: #334155; }
    #message { font-size: 14px; }
    footer { margin-top: 28px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">SMARTURL / LINK TOOLS</div>
    <h1>Short links.<br>Big possibilities.</h1>
    <p>Turn a long URL into a short, shareable link in seconds.</p>

    <form id="shortenForm">
      <input
        id="urlInput"
        type="url"
        placeholder="https://example.com/your-long-link"
        aria-label="Original URL"
        required
      >
      <button id="submit" type="submit">Create short link →</button>
    </form>

    <p id="message" role="status"></p>

    <section id="result">
      <p>Your short link is ready:</p>
      <a id="shortLink" href="#" target="_blank" rel="noopener noreferrer"></a>
      <br>
      <button id="copy" type="button">Copy link</button>
    </section>

    <footer>SmartURL · Fast lookup · SQLite · LRU cache</footer>
  </main>

  <script>
    const form = document.getElementById("shortenForm");
    const input = document.getElementById("urlInput");
    const submit = document.getElementById("submit");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const shortLink = document.getElementById("shortLink");
    const copyButton = document.getElementById("copy");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.style.display = "none";
      message.textContent = "Creating your short link...";
      submit.disabled = true;

      try {
        const response = await fetch("/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            original_url: input.value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Could not shorten this URL.");
        }

        shortLink.href = data.short_url;
        shortLink.textContent = data.short_url;
        result.style.display = "block";
        message.textContent = "Your link was created successfully.";
      } catch (error) {
        message.textContent =
          error.message || "Could not connect to SmartURL.";
      } finally {
        submit.disabled = false;
      }
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(shortLink.href);
        message.textContent = "Short link copied!";
      } catch {
        message.textContent =
          "Copy failed. Please copy the link manually.";
      }
    });
  </script>
</body>
</html>
